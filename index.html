<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mine — Remote Control</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #141926; --panel2: #1b2233; --text: #e8ecf4;
    --muted: #8b94a7; --accent: #4f8cff; --ok: #2ecc71; --err: #ff5d5d; --warn: #ffb648;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 12px; max-width: 720px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { font-size: 1.15rem; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
  .dot.on { background: var(--ok); }
  .panel { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 6px; }
  textarea {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid #2a3247;
    border-radius: 10px; padding: 12px; font-size: 1rem; resize: vertical; min-height: 70px;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; border: 0; border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.stop { background: var(--err); flex: 0 0 42%; }
  .status { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .status b { color: var(--text); }
  img#shot {
    width: 100%; border-radius: 10px; border: 1px solid #2a3247; display: none;
    background: #000; min-height: 120px; object-fit: contain;
  }
  #log {
    background: var(--panel2); border-radius: 10px; padding: 10px; max-height: 38vh;
    overflow-y: auto; font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    line-height: 1.5; color: var(--muted);
  }
  #log .t { color: var(--text); }
  #log .ok { color: var(--ok); }
  #log .err { color: var(--err); }
  #log .warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: .78rem; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="pcDot"></span>
    <h1>Mine — Remote Control</h1>
  </header>

  <div class="panel">
    <label for="goal">Task for Mine</label>
    <textarea id="goal" placeholder="e.g. go to wikipedia.org and search for Japan"></textarea>
    <div class="row">
      <button id="sendBtn">Run task</button>
      <button id="stopBtn" class="stop">■ Stop</button>
    </div>
    <div class="status">
      <span>PC: <b id="pcState">connecting…</b></span>
      <span>Task: <b id="taskState">—</b></span>
    </div>
    <div class="hint" id="tokenHint"></div>
  </div>

  <div class="panel">
    <label>Live screen (annotated)</label>
    <img id="shot" alt="latest screenshot">
  </div>

  <div class="panel">
    <label>Activity log</label>
    <div id="log">Waiting for PC…</div>
  </div>

<script>
/* ============================================================
 * Mine remote dashboard — talks ONLY to Firebase REST API.
 * Token lives in the URL hash (#/TOKEN) so it is never sent
 * to the Vercel host; it goes straight to Firebase as ?auth=.
 * ============================================================ */

// --- token from URL hash -------------------------------------
const token = (location.hash.replace(/^#\//, "") || "").trim();
document.getElementById("tokenHint").textContent = token
  ? "Connected with your access token. Bookmark this page — the token is part of the URL."
  : "⚠ No token in URL. Open this page as  https://YOUR-SITE.vercel.app/#/YOUR-TOKEN";

// --- Firebase config: filled in by you (3 constants) ----------
const FB_BASE   = "https://mine-2425-default-rtdb.asia-southeast1.firebasedatabase.app";   // e.g. mine-abc123.firebaseio.com (NO https://)
const FB_PREFIX = "";                              // bridge writes at the DB root; leave empty

const url = (path) => `https://${FB_BASE}${FB_PREFIX}${path}.json?auth=${encodeURIComponent(token)}`;

// --- element refs ---------------------------------------------
const $ = (id) => document.getElementById(id);
const logEl = $("log"), shotEl = $("shot"), pcDot = $("pcDot");
const sendBtn = $("sendBtn"), stopBtn = $("stopBtn");
const pcState = $("pcState"), taskState = $("taskState");

function logLine(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  // keep the log bounded on long sessions
  while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// --- actions ----------------------------------------------------
sendBtn.onclick = async () => {
  const goal = $("goal").value.trim();
  if (!goal) return alert("Type a task first.");
  sendBtn.disabled = true;
  try {
    const r = await fetch(url("/commands/task"), {
      method: "PUT",
      body: JSON.stringify({ goal, token, ts: Date.now() }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    logLine(`<span class="ok">▶ sent:</span> <span class="t">${esc(goal)}</span>`);
    taskState.textContent = "queued";
  } catch (e) {
    logLine(`<span class="err">✗ send failed: ${esc(e.message)} — check FB_BASE + token</span>`);
  }
  sendBtn.disabled = false;
};

stopBtn.onclick = async () => {
  try {
    await fetch(url("/commands/stop"), { method: "PUT", body: "true" });
    logLine('<span class="warn">■ stop requested</span>');
  } catch (e) {
    logLine(`<span class="err">✗ stop failed: ${esc(e.message)}</span>`);
  }
};

// --- polling loop (simple + reliable; no SDK needed) -------------
let logStartAt = Date.now() - 6 * 3600 * 1000; // show last ~6h of history

async function pollOnce() {
  try {
    // PC heartbeat + current status
    const s = await (await fetch(url("/status/current"))).json();
    if (s) {
      const alive = s.heartbeat && (Date.now() / 1000 - s.heartbeat < 15);
      pcDot.classList.toggle("on", !!alive);
      pcState.textContent = alive ? "online" : "offline";
      taskState.textContent = s.state || "—";
      if (s.thought) taskState.title = s.thought;
    }
    // latest screenshot
    const img = await (await fetch(url("/status/image"))).json();
    if (img && img.startsWith("data:image")) {
      if (shotEl.src !== img) shotEl.src = img;
      shotEl.style.display = "block";
    }
    // log entries: fetch the whole (trimmed) log, render only new items.
    // No orderBy query needed — avoids requiring a Firebase index.
    const logs = await (await fetch(url("/status/log"))).json() || {};
    const entries = Object.values(logs).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    for (const e of entries) {
      if ((e.ts || 0) <= logStartAt) continue;
      const cls = e.result === "ok" ? "ok" : (e.result && e.result !== "ok" ? "err" : "");
      const what = e.summary || e.thought || "";
      logLine(`<span class="t">${esc(e.action || "?")}</span> <span class="${cls}">${esc(e.result || "")}</span> ${esc(String(what).slice(0, 140))}`);
      logStartAt = e.ts || logStartAt;
    }
  } catch (e) {
    pcState.textContent = "offline";
    pcDot.classList.remove("on");
  }
}

function tick() { pollOnce(); }
tick();
setInterval(tick, 2500);
</script>
</body>
</html>
